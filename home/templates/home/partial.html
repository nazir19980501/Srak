{% load static %}
<a href="{% url 'university_detail' university.id %}"
   class="relative group block overflow-hidden rounded-xl shadow-lg">

    <img src="{{ university.image.url }}"
         class="h-64 w-full object-cover transition-transform duration-500 group-hover:scale-110">

    <div class="absolute inset-0 bg-linear-to-t
                from-black/80 via-black/30 to-transparent">
    </div>

    <div class="absolute bottom-0 left-0 right-0 p-5 text-white">
        <h3 class="text-xl font-bold">
            {{ university.name }}
        </h3>

        <p class="flex items-center gap-2 mt-2 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg"
                 class="w-4 h-4"
                 viewBox="0 0 24 24"
                 fill="currentColor">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
            </svg>

            {{ university.country }}, {{ university.city }}
        </p>

        <span class="inline-block mt-4 px-4 py-2 border rounded-lg
                     text-sm uppercase tracking-wide
                     transition-all duration-300
                     group-hover:bg-white group-hover:text-black">
            View Details
        </span>
    </div>
</a>
